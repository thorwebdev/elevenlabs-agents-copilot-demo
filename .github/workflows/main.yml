name: Main Branch CI/CD

on:
  push:
    branches: [main]

jobs:
  validate-configs:
    runs-on: ubuntu-latest
    name: Validate Agent Configurations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy ElevenLabs agents
        run: |
          npm install -g @elevenlabs/cli
          export ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          elevenlabs agents push --env prod --dry-run  # Preview changes
          elevenlabs agents push --env prod            # Deploy
          elevenlabs agents status                     # Verify deployment
